<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="glass" x1="64" y1="64" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.95"/>
      <stop offset="1" stop-color="white" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#bg)"/>

  <!-- Floating board -->
  <g filter="url(#shadow)">
    <rect x="52" y="52" width="152" height="152" rx="32" fill="url(#glass)"/>
  </g>

  <!-- Connection lines -->
  <path d="M92 96L128 128L164 92" stroke="#7C3AED" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M92 160L128 128L164 164" stroke="#06B6D4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodes -->
  <circle cx="92" cy="96" r="12" fill="#7C3AED"/>
  <circle cx="164" cy="92" r="12" fill="#8B5CF6"/>
  <circle cx="128" cy="128" r="14" fill="#111827"/>
  <circle cx="92" cy="160" r="12" fill="#06B6D4"/>
  <circle cx="164" cy="164" r="12" fill="#22D3EE"/>

  <!-- Tiny highlight -->
  <circle cx="188" cy="68" r="10" fill="white" fill-opacity="0.35"/>
</svg>